spring.datasource.url=jdbc:h2:mem:chatdemo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.auth.magic-link.ttl-minutes=15
app.auth.magic-link.app-base-url=http://localhost:5173

app.llm.base-url=http://localhost:11434/v1
app.llm.api-key=test-key
app.llm.model=test-model
app.llm.timeout-seconds=30
