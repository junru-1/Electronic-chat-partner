spring.application.name=chatdemo

spring.datasource.url=jdbc:mysql://localhost:3306/chatdemo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=change-me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.auth.magic-link.ttl-minutes=15
app.auth.magic-link.app-base-url=http://localhost:5173

app.llm.base-url=https://api.openai.com/v1
app.llm.api-key=change-me
app.llm.model=gpt-4.1-mini
app.llm.timeout-seconds=30

